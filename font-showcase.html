<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font Showcase — Gambetta</title>
    <link rel="stylesheet" href="assets/font/gambetta.css">
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Gambetta', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            gap: 4rem;
            padding: 2rem;
        }

        .showcase-item {
            text-align: center;
        }

        .label {
            font-family: sans-serif;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: #666;
            margin-bottom: 1rem;
        }

        .artist-name {
            font-size: 5rem;
            margin: 0;
            letter-spacing: 0.05em;
        }

        /* Variants */
        .regular {
            font-weight: 400;
            font-style: normal;
        }

        .italic {
            font-weight: 400;
            font-style: italic;
        }

        .bold {
            font-weight: 700;
            font-style: normal;
        }

        .bold-italic {
            font-weight: 700;
            font-style: italic;
        }

        @media (max-width: 768px) {
            .artist-name {
                font-size: 2.5rem;
            }
        }
    </style>
</head>

<body>

    <div class="showcase-item">
        <div class="label">Regular</div>
        <h1 class="artist-name regular">sofía abud</h1>
    </div>

    <div class="showcase-item">
        <div class="label">Italic</div>
        <h1 class="artist-name italic">sofía abud</h1>
    </div>

    <div class="showcase-item">
        <div class="label">Bold</div>
        <h1 class="artist-name bold">sofía abud</h1>
    </div>

    <div class="showcase-item">
        <div class="label">Bold Italic</div>
        <h1 class="artist-name bold-italic">sofía abud</h1>
    </div>

</body>

</html>
